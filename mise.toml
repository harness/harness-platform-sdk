# mise.toml
#
# Learn more about Mise-en-Place - https://mise.jdx.dev/getting-started.html
#
# Task runner for the Harness Python SDK project.
# Covers OpenAPI spec management, model generation, testing, and development utilities.

# ---------------------------------------------------------------------------
# OpenAPI Spec Management
# ---------------------------------------------------------------------------

[tasks."spec:fetch"]
description = "Fetch the latest OpenAPI spec from Harness"
run = "echo 'Placeholder: fetch OpenAPI spec from Harness'"

[tasks."spec:normalize"]
description = "Normalize the raw OpenAPI spec (removes incomplete discriminators, etc.)"
run = "python scripts/normalize_spec.py"

[tasks."spec:convert"]
description = "Convert the normalized spec to the format required for code generation"
run = "python scripts/convert_spec.py"

# ---------------------------------------------------------------------------
# Model Generation
#
# Notes:
#   - datamodel-code-generator 0.55.0 does not support --use-alias-generators; flag omitted
#   - --collapse-root-models causes IndexError on Harness spec; using --reuse-model only
#   - normalize_spec.py removes 36 incomplete discriminators to prevent generation failures
# ---------------------------------------------------------------------------

[tasks."models:generate"]
description = "Generate Pydantic v2 models from the normalized OpenAPI spec"
run = """
  python -m datamodel_code_generator \
    --input openapi/harness-openapi-normalized.json \
    --output datagen_staging/ \
    --input-file-type openapi \
    --output-model-type pydantic_v2.BaseModel \
    --reuse-model \
  && python scripts/stamp_generated.py
"""

[tasks."models:sort"]
description = "Sort and organise the generated model files"
run = "python scripts/sort_models.py"

# ---------------------------------------------------------------------------
# Combined Regeneration
# ---------------------------------------------------------------------------

[tasks.regenerate]
description = "Full pipeline: fetch → normalize → convert → generate → sort models"
run = [
    {task = "spec:fetch"},
    {task = "spec:normalize"},
    {task = "spec:convert"},
    {task = "models:generate"},
    {task = "models:sort"},
]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tasks.tests]
description = "Run the full test suite"
run = "pytest tests/"

[tasks."tests:cov"]
description = "Run the test suite with coverage report"
run = "pytest --cov=src/harness_python_sdk --cov-report=term-missing tests/"

[tasks."tests:watch"]
description = "Run tests in watch mode (re-runs on file changes)"
run = "pytest-watch tests/ -- -v"

# ---------------------------------------------------------------------------
# Development Utilities
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Format source and test files with black and isort"
run = "black src/ tests/ && isort src/ tests/"

[tasks."type-check"]
description = "Run mypy static type checking over the SDK source"
run = "mypy src/harness_python_sdk"

[tasks.clean]
description = "Remove build artefacts, caches, and coverage data"
run = "rm -rf .pytest_cache dist build *.egg-info .coverage"
