# mise.toml
#
# Learn more about Mise-en-Place - https://mise.jdx.dev/getting-started.html
#
# Task runner for the Harness Python SDK project.
# Covers OpenAPI spec management, model generation, testing, and development utilities.

# ---------------------------------------------------------------------------
# OpenAPI Spec Management
# ---------------------------------------------------------------------------

[tasks."fetch-spec"]
description = "Fetch the latest OpenAPI spec from Harness"
run = "echo 'Placeholder: fetch OpenAPI spec from Harness'"

[tasks."normalize-spec"]
description = "Normalize the raw OpenAPI spec (removes incomplete discriminators, etc.)"
run = "python scripts/normalize_spec.py"

[tasks."convert-spec"]
description = "RETIRED 2026-04-08 — see v0_design_decisions.md"
run = "echo 'convert-spec retired 2026-04-08 — see v0_design_decisions.md'"

# ---------------------------------------------------------------------------
# Model Generation
#
# Reduction flags removed:
#   - --reuse-model: Schema identity more valuable than lower model count (PM direction)
#   - --collapse-root-models: Causes IndexError on malformed root-type schemas with empty fields
#   - --use-alias-generators: Not supported in datamodel-code-generator 0.55.0
#
# NOTE: generate-models and sort-models tasks are retired as of 2026-04-08.
# See v0_design_decisions.md for context.
# ---------------------------------------------------------------------------

[tasks."generate-models"]
description = "RETIRED 2026-04-08 — see v0_design_decisions.md"
run = "echo 'generate-models retired 2026-04-08 — see v0_design_decisions.md'"

[tasks."sort-models"]
description = "RETIRED 2026-04-08 — see v0_design_decisions.md"
run = "echo 'sort-models retired 2026-04-08 — see v0_design_decisions.md'"

# ---------------------------------------------------------------------------
# Combined Regeneration
# ---------------------------------------------------------------------------

[tasks.regenerate]
description = "Regenerate: fetch-spec && normalize-spec only"
run = [
    {task = "fetch-spec"},
    {task = "normalize-spec"},
]

# ---------------------------------------------------------------------------
# Drift Detection and Baseline Management
# ---------------------------------------------------------------------------

[tasks."check-drift"]
description = "Check for drift between current spec and baseline checksums"
run = "python scripts/check_drift.py --compare"

[tasks.baseline]
description = "Generate and update baseline checksums from current spec"
run = "python scripts/check_drift.py"

[tasks."refresh-pagination"]
description = "Regenerate pagination inventory from current spec"
run = "python scripts/refresh_pagination.py"

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tasks.tests]
description = "Run the full test suite"
run = "pytest tests/"

[tasks."tests:cov"]
description = "Run the test suite with coverage report"
run = "pytest --cov=src/harness_python_sdk --cov-report=term-missing tests/"

[tasks."tests:watch"]
description = "Run tests in watch mode (re-runs on file changes)"
run = "pytest-watch tests/ -- -v"

[tasks."tests:smoke"]
description = "Run smoke tests"
run = "python scripts/run_smoke_tests.py"

[tasks."tests:smoke:test"]
description = "Run smoke tests on a Filtered class"
usage = '''
arg "<name>" help="The name of the new class to filter"
flag "--unit-cleanup"
'''
run = "python scripts/run_smoke_tests.py --skip-fixtures --filter-type ${usage_name?} ${usage_unit_cleanup:+--unit-cleanup}"

# ---------------------------------------------------------------------------
# Development Utilities
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Format source and test files with black and isort"
run = "black src/ tests/ && isort src/ tests/"

[tasks."type-check"]
description = "Run mypy static type checking over the SDK source"
run = "mypy src/harness_python_sdk"

[tasks.clean]
description = "Remove build artifacts, caches, and coverage data"
run = "rm -rf .pytest_cache dist build *.egg-info .coverage"

[tasks."clean:staging"]
description = "Remove and Recreate datagen_staging directory"
run = """
    rm -rf datagen_staging && \
    mkdir -p datagen_staging && \
    touch datagen_staging/.gitkeep
"""

[tasks."create:new"]
description = "Run the Api Class Generator"
run = "python scripts//generate_new_class.py"
