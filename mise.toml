# mise.toml
#
# Learn more about Mise-en-Place - https://mise.jdx.dev/getting-started.html
#
# Task runner for the Harness Python SDK project.
# Covers OpenAPI spec management, model generation, testing, and development utilities.

[env]
# Default environment variables
ROOT_DIR = "{{cwd}}"
BUILD_FLAGS = ""
STAGE = "release"
DOCKER_COMMAND = "docker"
DOCKERFILE = "Dockerfile"
DOCKER_IMAGE = "harness-platform-sdk"
DOCKER_TAG = "latest"
DOCKER_ENV = ""
DOCKER_MOUNTS = ""
PROJECT_DIR = "{{cwd}}/"
MODULE = "harness_platform_sdk"
WORKSPACE = "."
WORKDIR = "/harness"
DRONE_OUTPUT = "{{env.PROJECT_DIR}}DRONE_OUTPUT.env"
_.python.venv = { path = ".venv", create = true }

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

# Tasks
[tasks.help]
description = "Show all available tasks with descriptions"
run = "mise tasks"

[tasks.build]
description = "Build Module Wheel"
run = """
python -m pip install ".[publish]"
python -m build
"""

[tasks."build:docs"]
description = "Generate complete markdown for all symbols in the SDK."
run = """
python3 scripts/generate_llms.py
python3 scripts/build_docs.py
python3 -m pdoc -o docs/generated harness_platform_sdk --force
"""

[tasks."docker:build"]
description = "Builds the Container Image"
depends = ["build"]
run = """
BUILD_STAGE=""
if [ -n "${STAGE}" ]; then
  BUILD_STAGE="--target ${STAGE}"
fi
${DOCKER_COMMAND} build ${BUILD_FLAGS} ${BUILD_STAGE} -f ${WORKSPACE}/${DOCKERFILE} ${DOCKER_ARGS_CMD:-} -t ${DOCKER_IMAGE}:${DOCKER_TAG} ${WORKSPACE}
"""

[tasks."docker:push"]
description = "Pushes the Container Image to the remote repository"
run = "${DOCKER_COMMAND} push --all-platforms ${DOCKER_IMAGE}:${DOCKER_TAG}"

[tasks."docker:debug"]
description = "Loads the current directory into the container to allow running commands locally"
run = "${DOCKER_COMMAND} run --rm -it ${DOCKER_ENV} -v ${PROJECT_DIR}:/${WORKDIR} ${DOCKER_MOUNTS} -w ${WORKDIR} --entrypoint sh ${DOCKER_IMAGE}:${DOCKER_TAG}"

[tasks."docker:run"]
description = "Runs a local test of the container image"
usage = """
arg "<file_path>" help="Pass the script to run"
"""
run = "${DOCKER_COMMAND} run --rm -it ${DOCKER_ENV} -v ${PROJECT_DIR}:/${WORKDIR} ${DOCKER_MOUNTS} -w ${WORKDIR} ${DOCKER_IMAGE}:${DOCKER_TAG} ${usage_file_path}"

[tasks."docker:clean"]
description = "Cleans up all images associated with the DOCKER_IMAGE"
run = "${DOCKER_COMMAND} images --format '{{ \"{{\" }}.Repository}}:{{ \"{{\" }}.Tag}}' | grep ${DOCKER_IMAGE} | xargs ${DOCKER_COMMAND} rmi || true"


# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tasks.tests]
description = "Run the full test suite"
run = [
    { task = "lint" },
    { task = "tests:cov" },
    { task = "tests:integration --cleanup"},
]

[tasks."tests:cov"]
description = "Run the test suite with coverage report"
run = "pytest --cov=src/harness_platform_sdk --cov-report=term-missing tests/"

[tasks."tests:watch"]
description = "Run tests in watch mode (re-runs on file changes)"
run = "pytest-watch tests/ -- -v"

[tasks."tests:integration"]
description = "Run integration tests"
usage = '''
flag "--cleanup" help="Run full provision and delete tests"
'''
run = '''
if [ "${usage_cleanup:-false}" = "true" ]; then
  python scripts/run_smoke_tests.py --cleanup
else
  python scripts/run_smoke_tests.py
fi
'''

[tasks."tests:integration:single"]
description = "Run integration tests on a Filtered class"
usage = '''
arg "<name>" help="The name of the new class to filter"
flag "--unit-cleanup"
'''
run = "python scripts/run_smoke_tests.py --skip-fixtures --filter-type ${usage_name?} ${usage_unit_cleanup:+--unit-cleanup}"

# ---------------------------------------------------------------------------
# Development Utilities
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Lint Validation"
run = [
    {task = "lint:black"},
    {task = "lint:isort"},
    {task = "lint:type-check"},
    {task = "lint:docstrings"},
    {task = "tests:docstrings"}
]

[tasks."lint:black"]
description = "Format source and test files with black"
run = "black src/ tests/"

[tasks."lint:isort"]
description = "Format source and test files with isort"
run = "isort src/ tests/"

[tasks."lint:type-check"]
description = "Run mypy static type checking over the SDK source"
run = "mypy src/${MODULE}"

[tasks."lint:docstrings"]
description = "Lint docstrings"
run = "ruff check --select D src/${MODULE}"

[tasks."tests:docstrings"]
description = "Pytest docstrings"
run = "pytest tests/test_docstrings.py --doctest-modules src/${MODULE} -v"

[tasks.clean]
description = "Remove build artifacts, caches, and coverage data"
run = "rm -rf .pytest_cache dist build *.egg-info .coverage"

[tasks."clean:staging"]
description = "Remove and Recreate datagen_staging directory"
run = """
    rm -rf datagen_staging && \
    mkdir -p datagen_staging && \
    touch datagen_staging/.gitkeep
"""

[tasks."create:new"]
description = "Run the Api Class Generator"
run = "python scripts//generate_new_class.py"
