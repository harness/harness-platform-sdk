# Authentication section
authentication:
  - "API Key based (x-api-key header)"
  - "Account ID required (x-account-id header)"
  - "Optional Organization/Project scope"

# Code Examples
examples:
  - title: "Initialize Client"
    code: |
      from harness_platform_sdk import HarnessClient

      client = HarnessClient(
          api_key="YOUR_API_KEY",
          account_id="YOUR_ACCOUNT_ID"
      )

  - title: "List Organizations"
    code: |
      orgs = client.organizations.list()
      for org in orgs:
          print(f"{org.get('identifier')}: {org.get('name')}")

  - title: "Get Organization with Scope"
    code: |
      from harness_platform_sdk import Scope

      scope = Scope(account_id="MY_ACCOUNT", org="MY_ORG")
      org = client.organizations.get(
          org_id="MY_ORG",
          scope=scope
      )

  - title: "Handle Errors"
    code: |
      from harness_platform_sdk import (
          HarnessClient,
          ApiError,
          AuthError,
          ScopeNotSetError
      )

      try:
          client = HarnessClient(api_key="KEY", account_id="ACCT")
          org = client.organizations.get("org_id")
      except AuthError as e:
          print(f"Auth failed: {e.status_code}")
      except ApiError as e:
          print(f"API error: {e.status_code}, {e.body}")
      except ScopeNotSetError as e:
          print(f"Scope error: {e}")

# Configuration parameters
configuration:
  - key: "api_key"
    required: true
    description: "API key for authentication"
  - key: "account_id"
    required: true
    description: "Harness account ID"
  - key: "base_url"
    required: false
    description: "API base URL, defaults to https://app.harness.io"
  - key: "timeout"
    required: false
    description: "Request timeout in seconds, defaults to 30"
  - key: "max_retries"
    required: false
    description: "Max retry attempts, defaults to 3"
  - key: "retry_status_codes"
    required: false
    description: "HTTP codes to retry, defaults to [429, 503]"
  - key: "retry_enabled"
    required: false
    description: "Enable retry, defaults to True"
  - key: "verify_ssl"
    required: false
    description: "Verify SSL certificates, defaults to True"

# Type Hints section
type_hints:
  - "Parameter types documented"
  - "Return types documented"
  - "Exception types documented"
  - "Compatible with type checkers (mypy, pyright)"
  - "See `py.typed` marker in package for PEP 561 compliance"

# Testing section
testing:
  commands:
    - command: "python -m pytest tests/ -v"
      description: "Run tests"
    - command: "mypy src/harness_platform_sdk"
      description: "Check type hints"
    - command: "ruff check --select D src/harness_platform_sdk"
      description: "Lint docstrings"

